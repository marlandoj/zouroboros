<svg width="1600" height="1080" viewBox="0 0 1600 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F1B"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 40px Inter, ui-sans-serif, system-ui, sans-serif; fill: #F8FAFC; }
      .section { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.32em; fill: #6B7280; }
      .cardTitle { font: 700 27px Inter, ui-sans-serif, system-ui, sans-serif; }
      .chipText { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #B6C2D4; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #CBD5E1; }
      .tiny { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; letter-spacing: 0.08em; }
    </style>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#22C55E"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>
  <text x="56" y="64" class="title">Data Flows</text>
  <text x="1544" y="64" text-anchor="end" style="font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6B7280; font-style: italic;">A self-improving AI system from one request to finished work</text>
  <rect x="40" y="84" width="1520" height="2" rx="1" fill="#1F2937"/>

  <text x="800" y="132" text-anchor="middle" class="section">HOW ZOUROBOROS WORKS</text>

  <g filter="url(#softGlow)">
    <rect x="88" y="165" width="654" height="302" rx="22" fill="#09111F" stroke="#06B6D4" stroke-width="3"/>
    <rect x="858" y="165" width="654" height="302" rx="22" fill="#0D1121" stroke="#8B5CF6" stroke-width="3"/>
  </g>
  <text x="415" y="215" text-anchor="middle" class="cardTitle" fill="#22D3EE">Memory and Context</text>
  <text x="1185" y="215" text-anchor="middle" class="cardTitle" fill="#C084FC">Work Planning</text>

  <g>
    <rect x="118" y="244" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="415" y="263" text-anchor="middle" class="chipText">Gather conversation history</text>
    <rect x="118" y="282" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="415" y="301" text-anchor="middle" class="chipText">Extract key facts and events</text>
    <rect x="118" y="320" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="415" y="339" text-anchor="middle" class="chipText">Turn facts into searchable embeddings</text>
    <rect x="118" y="358" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="415" y="377" text-anchor="middle" class="chipText">Store in persistent memory database</text>
    <rect x="118" y="396" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="415" y="415" text-anchor="middle" class="chipText">Prepare briefing for next session</text>

    <rect x="888" y="244" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1185" y="263" text-anchor="middle" class="chipText">Break work into ordered steps</text>
    <rect x="888" y="282" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1185" y="301" text-anchor="middle" class="chipText">Check plan for problems</text>
    <rect x="888" y="320" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1185" y="339" text-anchor="middle" class="chipText">Find which steps can run together</text>
    <rect x="888" y="358" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1185" y="377" text-anchor="middle" class="chipText">Pick the best AI model for each step</text>
    <rect x="888" y="396" width="594" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1185" y="415" text-anchor="middle" class="chipText">Find relevant facts from memory</text>
  </g>

  <path d="M742 316H810" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrowCyan)" filter="url(#lineGlow)"/>

  <text x="800" y="516" text-anchor="middle" class="section">QUALITY CHECKS AND LEARNING</text>

  <g filter="url(#softGlow)">
    <rect x="88" y="548" width="560" height="244" rx="22" fill="#11131F" stroke="#F59E0B" stroke-width="3"/>
    <rect x="694" y="548" width="818" height="244" rx="22" fill="#0B1220" stroke="#22C55E" stroke-width="3"/>
  </g>
  <text x="368" y="598" text-anchor="middle" class="cardTitle" fill="#FBBF24">Check and Improve</text>
  <text x="1103" y="598" text-anchor="middle" class="cardTitle" fill="#4ADE80">Keep Everything Running</text>

  <g>
    <rect x="118" y="627" width="500" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="368" y="646" text-anchor="middle" class="chipText">Review what was done</text>
    <rect x="118" y="665" width="500" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="368" y="684" text-anchor="middle" class="chipText">Verify nothing was missed</text>
    <rect x="118" y="703" width="500" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="368" y="722" text-anchor="middle" class="chipText">Fix errors and retry if needed</text>
    <rect x="118" y="741" width="500" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="368" y="760" text-anchor="middle" class="chipText">Save useful lessons to memory</text>

    <rect x="724" y="627" width="758" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1103" y="646" text-anchor="middle" class="chipText">Monitor system health and spot problems</text>
    <rect x="724" y="665" width="758" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1103" y="684" text-anchor="middle" class="chipText">Refresh memories and update facts</text>
    <rect x="724" y="703" width="758" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1103" y="722" text-anchor="middle" class="chipText">Improve strategies based on what works</text>
    <rect x="724" y="741" width="758" height="28" rx="8" fill="#172133" stroke="#243244"/><text x="1103" y="760" text-anchor="middle" class="chipText">Keep memory consistent and reliable</text>
  </g>

  <path d="M1185 467V520H368V539" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrowAmber)" filter="url(#lineGlow)"/>

  <path d="M368 792V900H257V964" stroke="#22C55E" stroke-width="3" marker-end="url(#arrowGreen)" filter="url(#lineGlow)"/>

  <g filter="url(#softGlow)">
    <rect x="88" y="936" width="560" height="100" rx="18" fill="#09111F" stroke="#06B6D4" stroke-width="3"/>
    <rect x="694" y="936" width="818" height="100" rx="18" fill="#09111F" stroke="#22C55E" stroke-width="3"/>
  </g>
  <text x="368" y="975" text-anchor="middle" class="cardTitle" fill="#22D3EE" font-size="22">Stored Knowledge</text>
  <text x="1103" y="975" text-anchor="middle" class="cardTitle" fill="#4ADE80" font-size="22">Next Steps</text>
  <text x="368" y="1007" text-anchor="middle" class="body">facts, context, skills, insights</text>
  <text x="1103" y="1007" text-anchor="middle" class="body">scheduled checks, auto-repairs, improvements</text>
</svg>