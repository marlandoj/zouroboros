scenario_id: credential-absence
description: Linear credential absence fails closed before any provider call.
seed: 101
steps:
  - name: missing-credential
    run: env -u LINEAR_API_KEY bun {scripts_dir}/linear-puller.ts
    timeout_ms: 15000
    expect:
      exit_code: 2
      stderr_contains: ["FATAL: LINEAR_API_KEY not set"]
